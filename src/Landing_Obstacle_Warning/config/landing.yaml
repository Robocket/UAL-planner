landing_evaluator:
  ros__parameters:
    input_topic: /livox/lidar
    output_topic: /landing/status
    height_map_topic: /landing/height_map
    output_frame: base_link
    imu.extrinsics.rotation_rpy: [0.0, 0.0, 0.0]
    # Keep the process resident but idle until the flight controller enables it.
    startup_enabled: true
    enable_topic: /landing_evaluator/enable

    # Fixed LiDAR -> gravity-aligned aircraft/body frame transform, metres/radians.
    # Rotation order is Rz(yaw) * Ry(pitch) * Rx(roll).
    extrinsics.translation: [0.0, 0.0, 0.0]
    extrinsics.rotation_rpy: [0.0, 0.0, 0.0]

    # Optional gravity alignment from an IMU mounted in the LiDAR frame.
    imu.enabled: false
    imu.required: true
    imu.topic: /livox/imu
    imu.timeout_sec: 0.15
    imu.filter_alpha: 0.12
    imu.gravity_norm_filter_alpha: 0.01
    imu.max_angular_velocity: 0.8
    imu.max_accel_deviation_ratio: 0.30

    landing_radius: 0.70
    min_range: 0.30
    max_range: 30.0
    min_roi_points: 100
    ransac_iterations: 60
    ransac_seed: 1279348292
    ransac_distance: 0.06
    ransac_early_exit_ratio: 0.90
    max_slope_deg: 8.0
    max_roughness_rms: 0.05
    max_roughness_p95: 0.08
    # Occupancy in the cylinder between the aircraft and fitted landing plane.
    airspace_clearance_height: 0.12
    airspace_ceiling_z: -0.10
    airspace_min_points: 3
    max_occupied_cell_ratio: 0.0
    max_step_height: 0.10
    grid_resolution: 0.15
    max_grid_cells: 1000000
    grid_min_points: 2
    min_coverage_ratio: 0.80
    min_inlier_ratio: 0.70
    confirmation_frames: 3
    # Print LANDABLE once only after this many seconds of continuous safe status.
    landable_log_delay_sec: 5.0
    watchdog.cloud_timeout_sec: 0.30
    watchdog.publish_period_sec: 1.0
