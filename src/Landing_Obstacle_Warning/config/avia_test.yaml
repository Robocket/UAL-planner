landing_evaluator:
  ros__parameters:
    # livox_avia_driver PointCloud2 output.
    input_topic: /livox/lidar
    output_topic: /landing/status
    height_map_topic: /landing/height_map
    output_frame: base_link

    # Mounting assumption for this test: Avia +X points along gravity (down).
    # R=Ry(+pi/2): base_x=lidar_z, base_y=lidar_y, base_z=-lidar_x.
    # This guarantees that ground returns along lidar +X have negative base Z.
    # Replace translation with the measured lidar origin in base_link.
    extrinsics.translation: [0.0, 0.0, 0.0]
    extrinsics.rotation_rpy: [0.0, 1.5707963267948966, 0.0]
    # IMU-to-base rotation. Default is identical to point-cloud mounting;
    # change independently if the Avia IMU axes differ from lidar axes.
    imu.extrinsics.rotation_rpy: [0.0, 1.5707963267948966, 0.0]

    # The recorded Livox orientation quaternion is a constant identity. Use the
    # normalized accelerometer direction for low-cost roll/pitch compensation.
    imu.enabled: true
    imu.required: true
    imu.topic: /livox/imu
    imu.timeout_sec: 0.15
    imu.filter_alpha: 0.12
    imu.gravity_norm_filter_alpha: 0.01
    imu.max_angular_velocity: 0.8
    imu.max_accel_deviation_ratio: 0.30

    startup_enabled: true
    enable_topic: /landing_evaluator/enable

    # Initial bench-test ROI. Replace with aircraft radius + safety margin.
    landing_radius: 1.25
    min_range: 0.30
    max_range: 30.0
    min_roi_points: 100

    ransac_iterations: 60
    ransac_seed: 1279348292
    ransac_distance: 0.06
    ransac_early_exit_ratio: 0.90
    max_slope_deg: 8.0
    max_roughness_rms: 0.05
    max_roughness_p95: 0.08

    grid_resolution: 0.10
    max_grid_cells: 1000000
    grid_min_points: 2
    min_coverage_ratio: 0.80
    min_inlier_ratio: 0.70
    max_step_height: 0.10

    airspace_clearance_height: 0.12
    airspace_ceiling_z: -0.10
    airspace_min_points: 3
    max_occupied_cell_ratio: 0.0

    confirmation_frames: 3
    landable_log_delay_sec: 2.0
    watchdog.cloud_timeout_sec: 0.30
    watchdog.publish_period_sec: 1.0
