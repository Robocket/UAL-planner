landing_evaluator:
  ros__parameters:
    # Half-in-the-loop simulation publishes /clock.  This parameter affects
    # ROS timestamps; the safety watchdog intentionally continues to use wall
    # time so a paused or failed simulator produces UNKNOWN.
    use_sim_time: true

    # The evaluator accepts only sensor_msgs/msg/PointCloud2 with FLOAT32
    # x/y/z fields.  The topic may also be overridden from hil_sim.launch.py.
    input_topic: /livox/avia/points
    output_topic: /landing/status
    height_map_topic: /landing/height_map
    output_frame: base_link

    # PROVISIONAL Avia mounting assumption: point-cloud +X points down when
    # the aircraft is level.  Ry(+pi/2) maps it to base_link with +Z up:
    #   base_x = lidar_z, base_y = lidar_y, base_z = -lidar_x.
    # Confirm the simulated PointCloud2 frame and axes before flight testing.
    # The launch arguments override these values and reuse the same transform
    # for RViz, avoiding two independent copies of the mounting transform.
    extrinsics.translation: [0.0, 0.0, 0.0]
    extrinsics.rotation_rpy: [0.0, 1.5707963267948966, 0.0]

    # hil_sim.launch.py converts /gt/odom orientation (body -> Gazebo ENU) into
    # a synthetic gravity vector on this standard Imu topic.  The adapter is
    # simulation-only and has no PX4 message dependency.  Because it already
    # publishes in the evaluator body frame, the IMU extrinsic is identity.
    imu.enabled: true
    imu.required: true
    imu.topic: /landing/sim_gravity_imu
    imu.extrinsics.rotation_rpy: [0.0, 0.0, 0.0]
    imu.timeout_sec: 0.50
    imu.filter_alpha: 1.0
    imu.gravity_norm_filter_alpha: 0.01
    imu.max_angular_velocity: 2.0
    imu.max_accel_deviation_ratio: 0.30

    startup_enabled: true
    enable_topic: /landing_evaluator/enable

    # Placeholder footprint including safety margin.  Override from launch or
    # replace with the measured radius required by the simulated aircraft.
    landing_radius: 1.25
    min_range: 0.30
    max_range: 30.0
    min_roi_points: 100

    ransac_iterations: 60
    ransac_seed: 1279348292
    ransac_distance: 0.06
    ransac_early_exit_ratio: 0.90
    max_slope_deg: 8.0
    max_roughness_rms: 0.05
    max_roughness_p95: 0.08

    grid_resolution: 0.10
    max_grid_cells: 1000000
    grid_min_points: 2
    min_coverage_ratio: 0.80
    min_inlier_ratio: 0.70
    max_step_height: 0.10

    airspace_clearance_height: 0.12
    airspace_ceiling_z: -0.10
    airspace_min_points: 3
    max_occupied_cell_ratio: 0.0

    confirmation_frames: 3
    landable_log_delay_sec: 5.0
    # More tolerant than the hardware preset to absorb simulator scheduling
    # jitter.  Keep it at least three point-cloud periods.
    watchdog.cloud_timeout_sec: 0.50
    watchdog.publish_period_sec: 1.0
