# Offline RGB-only segmentation validation, not ROS node parameters.
model:
  weights: checkpoints/yolo11n-seg.pt
  download_url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n-seg.pt
  expected_sha256: 55ed65c56c91713d23e8402371c6c49a6fd84f257f7dce452e8d70e41dcbe152
  ultralytics_version: 8.3.226
  device: '0'
  half: false  # FP32 baseline first; no quantization/training/export in this trial.
prediction:
  sizes: [320, 480, 640]
  confidence: 0.25
  nms_iou: 0.7
  class_names: [boat]
  max_detections: 20
  rectangular_padding: false  # Fixed square tensor, preserves aspect via letterbox.
  retina_masks: true  # Export masks in ORIGINAL image coordinates.
benchmark:
  warmup_runs: 3
  warmup_image_index: 4
  measured_runs: 3
  torch_cpu_threads: 4
  output_dir: outputs/yolo11n_scene_water_fp32
  settings_dir: outputs/ultralytics_settings
export:
  annotated: true
  annotation_line_width: 2
  masks: true
dataset:
  manifests: [datasets/scene_water_audit/manifest.json, datasets/scene_water_yolo_clips/manifest.json]
extraction:
  bag_path: /home/htfp/data/Scene_Water_20260805_013651
  storage_id: mcap
  image_topic: /left_camera/image/compressed
  output_dir: datasets/scene_water_yolo_clips
  # Three 2 s clips at approximately the recorded 8 Hz, not a full-video evaluation.
  clip_starts_s: [180.0, 300.0, 420.0]
  clip_duration_s: 2.0
  sample_interval_s: 0.125
