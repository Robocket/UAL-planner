# Camera-only interface profile for the original Scene_Water rosbag.
scene_water_image_adapter:
  ros__parameters:
    use_sim_time: false
    input_topic: /left_camera/image/compressed
    output_topic: /left_camera/image
    output_encoding: bgr8
    # The bag's CompressedImage header.frame_id is empty; preserve it.
    frame_id: ""
    qos_depth: 1

sam3_segmentation:
  ros__parameters:
    use_sim_time: false
    image_topic: /left_camera/image

# Reserved input contract for the future visual distance estimator. No node
# consumes this section yet; it only preserves the agreed topics/calibration.
visual_distance_estimator:
  ros__parameters:
    use_sim_time: false
    segmentation_topic: /sam3/segmentation
    odometry_topic: /fsdk/aircraft_state
    camera_info_topic: /left_camera/camera_info
    use_camera_info_topic: false
    image_width: 1280
    image_height: 1024
    # Temporary Hikvision intrinsics retained from the existing setup.
    fx: 385.45
    fy: 385.45
    cx: -1.0
    cy: -1.0
