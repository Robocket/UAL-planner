# Explicit all-class, low-threshold check plus an aerial cargo-ship positive control.
model:
  weights: checkpoints/yolo11n-seg.pt
  download_url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n-seg.pt
  expected_sha256: 55ed65c56c91713d23e8402371c6c49a6fd84f257f7dce452e8d70e41dcbe152
  ultralytics_version: 8.3.226
  device: '0'
  half: false
prediction:
  sizes: [640]
  confidence: 0.1
  nms_iou: 0.7
  class_names: null  # ALL COCO classes for diagnosis only, not the target-output contract.
  max_detections: 20
  rectangular_padding: false
  retina_masks: true
benchmark:
  warmup_runs: 3
  warmup_image_index: 4
  measured_runs: 3
  torch_cpu_threads: 4
  output_dir: outputs/yolo11n_scene_water_diagnostic
  settings_dir: outputs/ultralytics_settings
export:
  annotated: true
  annotation_line_width: 2
  masks: true
dataset:
  manifests: [datasets/scene_water_audit/manifest.json, datasets/scene_water_yolo_clips/manifest.json]
  control_images: [datasets/mtred_ship/scene03_0000.png, datasets/mtred_ship/scene03_0061.png]
