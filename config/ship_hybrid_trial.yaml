# Offline automatic boxes -> candidate instance masks. NO tracking/distance/ROS.
detector:
  weights: checkpoints/seadronessee_yolo11n.pt
  download_url: https://huggingface.co/dronefreak/seadronessee-yolo11n/resolve/8afc232ee3c50f82b3bd40458e2629a020597f26/best.pt
  expected_sha256: b6702b3af13103892abf42c2da08f417e3d58c791b57ab3b2ba5ebceb90f1b6a
  size: 640
  confidence: 0.25
  nms_iou: 0.7
  class_names: [boat]
  max_detections: 20
mobile_sam:
  weights: checkpoints/mobile_sam.pt
  download_url: https://github.com/ultralytics/assets/releases/download/v8.3.0/mobile_sam.pt
  expected_sha256: 6dbb90523a35330fedd7f1d3dfc66f995213d81b29a5ca8108dbcdd4e37d6c2f
  size: 1024  # Native encoder geometry; not an arbitrary resize knob.
  quality_threshold: 0.0  # SAM quality score is NOT a boat class confidence.
grabcut:
  crop_context_fraction: 0.10
  max_crop_edge: 384
  iterations: 3
  border_background_px: 1
  rng_seed: 0
benchmark:
  methods: [grabcut, mobilesam]
  ultralytics_version: 8.3.226
  device: '0'
  half: false
  warmup_runs: 3
  warmup_image_index: 4
  measured_runs: 3
  torch_cpu_threads: 4
  opencv_cpu_threads: 4
  output_dir: outputs/ship_hybrid_trial_fp32
  settings_dir: outputs/ultralytics_settings
export:
  annotated: true
  masks: true
  overlay_alpha: 0.4
  box_line_width: 2
  color_bgr: [0, 200, 0]
dataset:
  manifests: [datasets/scene_water_audit/manifest.json, datasets/scene_water_yolo_clips/manifest.json]
  control_images: [datasets/mtred_ship/scene03_0000.png, datasets/mtred_ship/scene03_0061.png]
